# MFDataIndia — PostgreSQL 18 system of record.
#
#   docker compose up -d
#
# On first start, the init script applies the canonical numbered migrations and
# records their hashes in mf.schema_migrations. Existing databases advance only
# through the application migration runner; historical migrations are not
# replayed against a restored schema.
#
# Sizing note: nav_history reaches ~5.4M rows for the required 5-year window and
# ~26M with full history (~2.5GB including indexes). The defaults below are
# modest; raise shared_buffers and work_mem for a production host.

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: mfdataindia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mfdataindia}
      POSTGRES_USER: ${POSTGRES_USER:-mfdata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mfdata}
      # Indian market data: keep timestamps unambiguous.
      TZ: Asia/Kolkata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql:/migrations:ro
      - ./docker/initdb/001_apply_migrations.sh:/docker-entrypoint-initdb.d/001_apply_migrations.sh:ro
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=2GB
      # Partition pruning is what makes the 5-year window cheap.
      - -c
      - enable_partition_pruning=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mfdata} -d ${POSTGRES_DB:-mfdataindia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
