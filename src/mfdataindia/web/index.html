<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFDataIndia</title>
  <script>
    // Apply the saved (or OS) theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("mfd-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none"><span class="accent">MFD</span>ataIndia</a>
      <small id="brand-sub">Indian Regular-Plan mutual funds</small>
    </div>
    <div class="search">
      <span class="icon">&#128269;</span>
      <input id="q" type="text" placeholder="Search funds, ISIN, or scheme code…" autocomplete="off">
      <div id="suggest-box" class="suggest" style="display:none"></div>
    </div>
    <a class="toplink" href="/compare">Compare<span class="cmp-count" id="compare-count" style="display:none"></span></a>
    <button id="theme-toggle" class="toplink" type="button" aria-label="Toggle dark mode"></button>
  </div>

  <div class="container">
    <div class="statbar" id="statbar"><span class="loading">Loading…</span></div>

    <div class="card movers-card">
      <div class="movers-head">
        <span class="movers-title">Top movers by category</span>
        <div class="movers-controls">
          <div class="range-btns" id="movers-period">
            <button data-p="1d">1D</button>
            <button data-p="1w">1W</button>
            <button data-p="1m" class="active">1M</button>
            <button data-p="3m">3M</button>
            <button data-p="1y">1Y</button>
          </div>
        </div>
      </div>
      <div id="catmovers"><div class="loading">Loading…</div></div>
    </div>

    <div class="filters">
      <select id="f-amc"><option value="">All fund houses</option></select>
      <select id="f-cat"><option value="">All categories</option></select>
      <select id="f-opt"><option value="">All options</option></select>
      <select id="f-sort">
        <option value="name">Sort: Name</option>
        <option value="nav">Sort: Latest NAV</option>
        <option value="aum">Sort: AUM</option>
        <option value="return_5y">Sort: 5Y return</option>
        <option value="expense">Sort: Expense ratio</option>
      </select>
      <label class="grouptoggle">
        <input type="checkbox" id="f-family"> Group by scheme family
      </label>
    </div>

    <div class="card">
      <div id="list"><div class="loading">Loading funds…</div></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>

  <script src="/static/compare-cart.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/index.js"></script>
</body>
</html>
