name: Refresh MFDataIndia NAV DEV

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type trillionlane-dev"
        required: true
        type: string
      confirm_job:
        description: "Type tlws-mf-data-nav-refresh-dev"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tlws-mf-data-dev-mutations
  cancel-in-progress: false

env:
  EXPECTED_PROJECT: trillionlane-dev
  EXPECTED_REGION: asia-south1
  SERVICE_NAME: tlws-mf-data-dev
  REFRESH_JOB: tlws-mf-data-nav-refresh-dev
  PRIVATE_SMOKE_JOB: tlws-mf-data-private-smoke-dev

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1403671867'
    environment: mf-data-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate supervised execution contract
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_project }}" = "$EXPECTED_PROJECT"
          test "${{ inputs.confirm_job }}" = "$REFRESH_JOB"
          test "$GITHUB_REPOSITORY" = "trillionlane/tlws-mfindia"
          test "$GITHUB_REPOSITORY_ID" = "1403671867"
          test "$GITHUB_REF" = "refs/heads/main"

      - id: auth
        name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service_account: ${{ vars.GCP_TLWS_MF_DATA_DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy the exact live image as a zero-retry refresh job
        shell: bash
        run: |
          set -euo pipefail
          test "${{ vars.GCP_PROJECT_ID }}" = "$EXPECTED_PROJECT"
          test "${{ vars.GCP_REGION }}" = "$EXPECTED_REGION"
          image="$(gcloud run services describe "$SERVICE_NAME" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format='value(spec.template.spec.containers[0].image)')"
          case "$image" in
            "$EXPECTED_REGION-docker.pkg.dev/$EXPECTED_PROJECT/${{ vars.GCP_ARTIFACT_REPOSITORY }}/mfdataindia@sha256:"*) ;;
            *) echo "Unexpected live image: $image" >&2; exit 1 ;;
          esac
          gcloud run jobs deploy "$REFRESH_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --image="$image" \
            --service-account="${{ vars.GCP_TLWS_MF_DATA_INGEST_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ vars.GCP_TLWS_MF_DATA_CLOUD_SQL_INSTANCE }}" \
            --set-secrets=MFDATAINDIA_DSN=tlws-mf-data-ingest-dsn-dev:latest \
            --set-env-vars=MFDATAINDIA_SNAPSHOT_SCOPE=FULL \
            --command=/app/.venv/bin/python \
            --args=/app/scripts/refresh_daily.py \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --cpu=1 \
            --memory=1Gi \
            --labels=product=mfdataindia,environment=dev,operation=nav-refresh,managed-by=github-actions \
            --quiet

          refresh_json="$(gcloud run jobs describe "$REFRESH_JOB" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          test "$(jq -er '.spec.template.spec.template.spec.containers[0].image' <<<"$refresh_json")" = "$image"
          test "$(jq -er '.spec.template.spec.template.spec.containers[0].env[] | select(.name == "MFDATAINDIA_SNAPSHOT_SCOPE") | .value' <<<"$refresh_json")" = "FULL"
          jq -e '.spec.template.spec.template.spec.maxRetries == 0' <<<"$refresh_json" >/dev/null

      - name: Execute the governed refresh with transactional integrity checks
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$REFRESH_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --wait \
            --quiet

      - name: Verify the refreshed private API from the internal smoke job
        shell: bash
        run: |
          set -euo pipefail
          live_image="$(gcloud run services describe "$SERVICE_NAME" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format='value(spec.template.spec.containers[0].image)')"
          smoke_json="$(gcloud run jobs describe "$PRIVATE_SMOKE_JOB" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          smoke_image="$(jq -er '.spec.template.spec.template.spec.containers[0].image' <<<"$smoke_json")"
          test "$smoke_image" = "$live_image"
          jq -e '.spec.template.spec.template.spec.maxRetries == 0' <<<"$smoke_json" >/dev/null
          jq -e '.spec.template.spec.template.spec.containers[0].args == ["/app/scripts/smoke_private_api.py"]' <<<"$smoke_json" >/dev/null
          gcloud run jobs execute "$PRIVATE_SMOKE_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --wait \
            --quiet
