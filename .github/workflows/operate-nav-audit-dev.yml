name: Operate MFDataIndia NAV Audit DEV

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bounded audit operation"
        required: true
        type: choice
        options: [dry-run, apply, certify]
      confirm_project:
        description: "Type trillionlane-dev"
        required: true
        type: string
      confirm_job:
        description: "Type tlws-mf-data-nav-audit-dev"
        required: true
        type: string
      expected_git_sha:
        description: "Exact deployed MFData SHA"
        required: true
        type: string
      expected_image_digest:
        description: "Exact deployed sha256 image digest"
        required: true
        type: string
      expected_dataset_version:
        description: "Exact dataset version observed by the preceding gate"
        required: true
        type: string
      prior_result_sha256:
        description: "Apply: dry-run result hash; certify: apply result hash; dry-run: empty"
        required: false
        default: ""
        type: string
      approval_reference:
        description: "Apply only: exact DATA-01 approval reference"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: tlws-mf-data-dev-mutations
  cancel-in-progress: false

env:
  EXPECTED_PROJECT: trillionlane-dev
  EXPECTED_REGION: asia-south1
  AUDIT_JOB: tlws-mf-data-nav-audit-dev
  AUDIT_SERVICE_ACCOUNT: tlws-mf-data-audit-dev@trillionlane-dev.iam.gserviceaccount.com
  AUDIT_SCHEDULER: tlws-mf-data-nav-audit-dev

jobs:
  operate:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1403671867'
    environment: mf-data-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate exact bounded request
        shell: bash
        run: |
          set -euo pipefail
          required_input() { jq -er --arg name "$1" '.inputs[$name]' "$GITHUB_EVENT_PATH"; }
          optional_input() { jq -r --arg name "$1" '.inputs[$name] // ""' "$GITHUB_EVENT_PATH"; }
          requested_project="$(required_input confirm_project)"
          requested_job="$(required_input confirm_job)"
          requested_sha="$(required_input expected_git_sha)"
          image_digest="$(required_input expected_image_digest)"
          dataset_version="$(required_input expected_dataset_version)"
          mode="$(required_input mode)"
          prior="$(optional_input prior_result_sha256)"
          approval="$(optional_input approval_reference)"
          test "$requested_project" = "$EXPECTED_PROJECT"
          test "$requested_job" = "$AUDIT_JOB"
          test "$requested_sha" = "$GITHUB_SHA"
          case "$GITHUB_SHA" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "${#GITHUB_SHA}" = 40
          image_hex="${image_digest#sha256:}"
          test "$image_hex" != "$image_digest"
          case "$image_hex" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "${#image_hex}" = 64
          case "$dataset_version" in *[!0-9]*|'') exit 1 ;; esac
          test "$dataset_version" -gt 0

          if [[ "$mode" == "dry-run" ]]; then
            test -z "$prior$approval"
          elif [[ "$mode" == "apply" ]]; then
            case "$prior" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#prior}" = 64
            case "$approval" in DATA-01-[A-Z0-9][A-Z0-9._-]* ) ;; *) exit 1 ;; esac
            test "${#approval}" -le 120
          elif [[ "$mode" == "certify" ]]; then
            case "$prior" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#prior}" = 64
            test -z "$approval"
          else
            exit 1
          fi

      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          project_id: ${{ env.EXPECTED_PROJECT }}
          service_account: ${{ vars.GCP_TLWS_MF_DATA_DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify exact dormant/certified job
        shell: bash
        run: |
          set -euo pipefail
          requested_digest="$(jq -er '.inputs.expected_image_digest' "$GITHUB_EVENT_PATH")"
          requested_sha="$(jq -er '.inputs.expected_git_sha' "$GITHUB_EVENT_PATH")"
          mode="$(jq -er '.inputs.mode' "$GITHUB_EVENT_PATH")"
          job_json="$(gcloud run jobs describe "$AUDIT_JOB" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          test "$(jq -er '.spec.template.spec.template.spec.serviceAccountName' <<<"$job_json")" = "$AUDIT_SERVICE_ACCOUNT"
          image="$(jq -er '.spec.template.spec.template.spec.containers[0].image' <<<"$job_json")"
          case "$image" in
            *@sha256:*) digest="${image##*@}" ;;
            *) digest="$(gcloud artifacts docker images describe "$image" --project="$EXPECTED_PROJECT" --format='value(image_summary.digest)')" ;;
          esac
          test "$digest" = "$requested_digest"
          test "$(jq -er '.spec.template.spec.template.spec.containers[0].env[] | select(.name == "DEPLOYMENT_GIT_SHA") | .value' <<<"$job_json")" = "$requested_sha"
          jq -e '.spec.template.spec.template.spec.maxRetries == 0' <<<"$job_json" >/dev/null
          jq -e '.spec.template.spec.taskCount == 1' <<<"$job_json" >/dev/null
          jq -e '.spec.template.spec.template.spec.containers[0].args == ["/app/scripts/audit_nav_integrity.py", "--summary-only"]' <<<"$job_json" >/dev/null

          if [[ "$mode" != "certify" ]]; then
            scheduler="$(gcloud scheduler jobs list --project="$EXPECTED_PROJECT" --location="$EXPECTED_REGION" --filter="name=$AUDIT_SCHEDULER" --format='value(name)')"
            if [[ -n "$scheduler" ]]; then
              state="$(gcloud scheduler jobs describe "$AUDIT_SCHEDULER" --project="$EXPECTED_PROJECT" --location="$EXPECTED_REGION" --format='value(state)')"
              test "$state" = "PAUSED" || {
                echo "Manual dry-run/apply is not admitted while the audit schedule is active." >&2
                exit 1
              }
            fi
          fi

      - name: Verify the exact preceding gate
        id: prior
        if: inputs.mode != 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          mode="$(jq -er '.inputs.mode' "$GITHUB_EVENT_PATH")"
          expected_version="$(jq -er '.inputs.expected_dataset_version' "$GITHUB_EVENT_PATH")"
          expected_prior="$(jq -er '.inputs.prior_result_sha256' "$GITHUB_EVENT_PATH")"
          latest="$(gcloud run jobs executions list --job="$AUDIT_JOB" \
            --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" \
            --limit=1 --format='value(metadata.name)')"
          test -n "$latest"
          execution_json="$(gcloud run jobs executions describe "$latest" \
            --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          jq -e '.status.conditions[] | select(.type == "Completed") | .status == "True"' \
            <<<"$execution_json" >/dev/null

          prior_result=""
          for attempt in 1 2 3 4 5; do
            logs="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$AUDIT_JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$latest\"" \
              --project="$EXPECTED_PROJECT" --limit=50 --order=asc --format=json)"
            prior_result="$(bash scripts/extract_cloud_run_json_result.sh <<<"$logs")"
            test -n "$prior_result" && break
            sleep 3
          done
          test -n "$prior_result"
          canonical="$(jq -ceS . <<<"$prior_result")"
          actual_sha256="$(printf '%s' "$canonical" | sha256sum | cut -d' ' -f1)"
          test "$actual_sha256" = "$expected_prior"
          jq -e --argjson version "$expected_version" \
            '.dataset_version == $version and .schemes_assessed > 0 and
             .nav_rows_scanned > 0 and
             (.findings_sha256 | test("^[0-9a-f]{64}$"))' \
            <<<"$canonical" >/dev/null
          if [[ "$mode" == "apply" ]]; then
            jq -e '.status == "NAV_INTEGRITY_AUDIT_DRY_RUN" and
                   .assessments_written == 0' <<<"$canonical" >/dev/null
          else
            bash scripts/validate_nav_audit_apply_result.sh <<<"$canonical"
          fi
          echo "findings_sha256=$(jq -er '.findings_sha256' <<<"$canonical")" \
            >> "$GITHUB_OUTPUT"

      - name: Execute exactly once and retain bounded evidence
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mode="$(jq -er '.inputs.mode' "$GITHUB_EVENT_PATH")"
          expected_version="$(jq -er '.inputs.expected_dataset_version' "$GITHUB_EVENT_PATH")"
          args=(/app/scripts/audit_nav_integrity.py --summary-only --expected-dataset-version "$expected_version")
          case "$mode" in
            dry-run) args+=(--dry-run) ;;
            apply) ;;
            certify) args+=(--certify-current) ;;
          esac
          joined="$(IFS=,; printf '%s' "${args[*]}")"
          execution="$(gcloud run jobs execute "$AUDIT_JOB" \
            --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" \
            --args="$joined" --wait --format='value(metadata.name)')"
          test -n "$execution"

          result=""
          for attempt in 1 2 3 4 5; do
            logs="$(gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$AUDIT_JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\"" \
              --project="$EXPECTED_PROJECT" --limit=50 --order=asc --format=json)"
            result="$(bash scripts/extract_cloud_run_json_result.sh <<<"$logs")"
            test -n "$result" && break
            sleep 3
          done
          test -n "$result"
          canonical="$(jq -ceS . <<<"$result")"
          result_sha256="$(printf '%s' "$canonical" | sha256sum | cut -d' ' -f1)"
          evidence="$RUNNER_TEMP/nav-audit-result.json"
          printf '%s\n' "$canonical" > "$evidence"

          case "$mode" in
            dry-run)
              jq -e '
                .status == "NAV_INTEGRITY_AUDIT_DRY_RUN" and
                .assessments_written == 0 and .dataset_version > 0 and
                .schemes_assessed > 0 and .nav_rows_scanned > 0 and
                (.findings_sha256 | test("^[0-9a-f]{64}$"))
              ' "$evidence" >/dev/null
              ;;
            apply)
              bash scripts/validate_nav_audit_apply_result.sh <"$evidence"
              ;;
            certify)
              jq -e '
                .status == "NAV_INTEGRITY_AUDIT_CERTIFIED" and
                .assessments_written == 0 and .dataset_version > 0 and
                .schemes_assessed > 0 and .nav_rows_scanned > 0 and
                (.findings_sha256 | test("^[0-9a-f]{64}$"))
              ' "$evidence" >/dev/null
              ;;
          esac
          if [[ "$mode" != "dry-run" ]]; then
            test "$(jq -er '.findings_sha256' "$evidence")" = \
              "${{ steps.prior.outputs.findings_sha256 }}"
          fi
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          echo "result_sha256=$result_sha256" >> "$GITHUB_OUTPUT"
          echo "NAV audit $mode result sha256: $result_sha256"

      - name: Upload bounded evidence
        uses: actions/upload-artifact@v4
        with:
          name: nav-audit-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nav-audit-result.json
          if-no-files-found: error
          retention-days: 30
