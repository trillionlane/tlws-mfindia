name: Deploy MFDataIndia DEV

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type trillionlane-dev to confirm the DEV target"
        required: true
        type: string
      expected_git_sha:
        description: "Exact current main commit admitted by automatic Verify"
        required: true
        type: string
      verify_run_id:
        description: "Exact automatic main Verify run ID"
        required: true
        type: string
      verify_run_attempt:
        description: "Exact complete Verify attempt"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: tlws-mf-data-dev-mutations
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: trillionlane/tlws-mfindia
  EXPECTED_REPOSITORY_ID: "1403671867"
  EXPECTED_PROJECT: trillionlane-dev
  EXPECTED_REGION: asia-south1
  IMAGE_NAME: mfdataindia
  SERVICE_NAME: tlws-mf-data-dev
  ASSOCIATION_SERVICE_NAME: tlws-mf-data-association-writer-dev
  ASSOCIATION_RUNTIME_SERVICE_ACCOUNT: tlws-mf-assoc-writer-dev@trillionlane-dev.iam.gserviceaccount.com
  ASSOCIATION_WRITER_PROVISIONED: ${{ vars.MFDATAINDIA_ASSOCIATION_WRITER_PROVISIONED || 'false' }}
  MIGRATION_JOB: tlws-mf-data-migrate-dev
  REFRESH_JOB: tlws-mf-data-nav-refresh-dev
  PRIVATE_SMOKE_JOB: tlws-mf-data-private-smoke-dev
  INSIGHTS_SERVICE_NAME: trillion-insights-api-dev
  INSIGHTS_RUNTIME_SERVICE_ACCOUNT: trillion-insights-runtime-dev@trillionlane-dev.iam.gserviceaccount.com
  VPC_NETWORK: tl-dev-vpc
  VPC_SUBNET: tl-dev-mumbai

jobs:
  admission:
    if: >-
      github.repository == 'trillionlane/tlws-mfindia' &&
      github.repository_id == '1403671867' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'trillionlane/tlws-mfindia' &&
        vars.MFDATAINDIA_DEV_AUTO_DEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_sha: ${{ steps.admit.outputs.candidate_sha }}
      packet_sha256: ${{ steps.admit.outputs.packet_sha256 }}
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_git_sha }}
      VERIFY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.verify_run_id }}
      VERIFY_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.verify_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Trust the immutable source of this main-branch workflow, not the candidate.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify trusted admission source before running repository code
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: admit
        name: Require exact automatic MAIN release admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_admission.py consume
          --run-id "$VERIFY_RUN_ID"
          --run-attempt "$VERIFY_RUN_ATTEMPT"
          --candidate-sha "$CANDIDATE_SHA"
          --output "$RUNNER_TEMP/consumed-release-admission.json"
          --summary "$GITHUB_STEP_SUMMARY"
          --github-output "$GITHUB_OUTPUT"

  deploy:
    needs: admission
    environment: mf-data-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_CANDIDATE_SHA: ${{ needs.admission.outputs.candidate_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.candidate_sha }}

      - name: Validate immutable deployment contract
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_TLWS_MF_DATA_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_TLWS_MF_DATA_RUNTIME_SERVICE_ACCOUNT }}
          INGEST_SERVICE_ACCOUNT: ${{ vars.GCP_TLWS_MF_DATA_INGEST_SERVICE_ACCOUNT }}
          ASSOCIATION_WRITER_SERVICE_ACCOUNT: ${{ vars.GCP_TLWS_MF_DATA_ASSOCIATION_WRITER_SERVICE_ACCOUNT }}
          MIGRATE_SERVICE_ACCOUNT: ${{ vars.GCP_TLWS_MF_DATA_MIGRATE_SERVICE_ACCOUNT }}
          CLOUD_SQL_INSTANCE: ${{ vars.GCP_TLWS_MF_DATA_CLOUD_SQL_INSTANCE }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION ARTIFACT_REPOSITORY WORKLOAD_IDENTITY_PROVIDER DEPLOY_SERVICE_ACCOUNT RUNTIME_SERVICE_ACCOUNT INGEST_SERVICE_ACCOUNT MIGRATE_SERVICE_ACCOUNT CLOUD_SQL_INSTANCE; do
            test -n "${!name:-}" || { echo "Missing mf-data-dev variable: $name" >&2; exit 1; }
          done
          case "$ASSOCIATION_WRITER_PROVISIONED" in
            true|false) ;;
            *) echo "MFDATAINDIA_ASSOCIATION_WRITER_PROVISIONED must be true or false" >&2; exit 1 ;;
          esac
          if [[ "$ASSOCIATION_WRITER_PROVISIONED" == "true" ]]; then
            test -n "${ASSOCIATION_WRITER_SERVICE_ACCOUNT:-}" || {
              echo "Missing mf-data-dev variable: ASSOCIATION_WRITER_SERVICE_ACCOUNT" >&2
              exit 1
            }
            test "$ASSOCIATION_WRITER_SERVICE_ACCOUNT" = "$ASSOCIATION_RUNTIME_SERVICE_ACCOUNT"
          fi
          test "$PROJECT_ID" = "$EXPECTED_PROJECT"
          test "$REGION" = "$EXPECTED_REGION"
          test "$ARTIFACT_REPOSITORY" = "tlws-mf-data-dev"
          test "$CLOUD_SQL_INSTANCE" = "trillionlane-dev:asia-south1:tlws-mf-data-dev"
          test "$RUNTIME_SERVICE_ACCOUNT" = "tlws-mf-data-runtime-dev@trillionlane-dev.iam.gserviceaccount.com"
          test "$INSIGHTS_RUNTIME_SERVICE_ACCOUNT" = "trillion-insights-runtime-dev@trillionlane-dev.iam.gserviceaccount.com"
          test "$VPC_NETWORK" = "tl-dev-vpc"
          test "$VPC_SUBNET" = "tl-dev-mumbai"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$CONFIRM_PROJECT" = "$EXPECTED_PROJECT"
            test "$EXPECTED_GIT_SHA" = "$RELEASE_CANDIDATE_SHA"
          fi

      - id: auth
        name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service_account: ${{ vars.GCP_TLWS_MF_DATA_DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authenticated target
        shell: bash
        run: |
          set -euo pipefail
          test "${CLOUDSDK_CORE_PROJECT:-}" = "$EXPECTED_PROJECT"
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" = "${{ vars.GCP_TLWS_MF_DATA_DEPLOY_SERVICE_ACCOUNT }}"
          test "$(gcloud sql instances describe tlws-mf-data-dev --project="$EXPECTED_PROJECT" --format='value(connectionName)')" = "${{ vars.GCP_TLWS_MF_DATA_CLOUD_SQL_INSTANCE }}"
          test "$(gcloud run services describe "$INSIGHTS_SERVICE_NAME" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format='value(spec.template.spec.serviceAccountName)')" = "$INSIGHTS_RUNTIME_SERVICE_ACCOUNT"
          test "$(gcloud run services describe tl-dwf-dev-api --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format='value(spec.template.spec.serviceAccountName)')" = "tl-dwf-dev-runtime@trillionlane-dev.iam.gserviceaccount.com"
          if [[ "$ASSOCIATION_WRITER_PROVISIONED" == "false" ]]; then
            bash ./scripts/verify_optional_association_writer_dev.sh \
              "$EXPECTED_PROJECT" \
              "$EXPECTED_REGION" \
              "$ASSOCIATION_SERVICE_NAME"
          fi

      - name: Verify private-read access before publishing
        shell: bash
        run: bash scripts/private_read_invokers_dev.sh preflight

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "$EXPECTED_REGION-docker.pkg.dev" --quiet

      - name: Build and publish immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$EXPECTED_REGION-docker.pkg.dev/$EXPECTED_PROJECT/${{ vars.GCP_ARTIFACT_REPOSITORY }}/$IMAGE_NAME:$RELEASE_CANDIDATE_SHA"
          docker build --build-arg VCS_REF="$RELEASE_CANDIDATE_SHA" --tag "$image" .
          docker push "$image"
          pushed_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          case "$pushed_ref" in
            "$EXPECTED_REGION-docker.pkg.dev/$EXPECTED_PROJECT/${{ vars.GCP_ARTIFACT_REPOSITORY }}/$IMAGE_NAME@sha256:"*) ;;
            *) echo "Unexpected pushed image reference: $pushed_ref" >&2; exit 1 ;;
          esac
          digest="${pushed_ref##*@}"
          echo "uri=$EXPECTED_REGION-docker.pkg.dev/$EXPECTED_PROJECT/${{ vars.GCP_ARTIFACT_REPOSITORY }}/$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy and execute the zero-retry migration job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="${{ vars.GCP_TLWS_MF_DATA_MIGRATE_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ vars.GCP_TLWS_MF_DATA_CLOUD_SQL_INSTANCE }}" \
            --set-secrets=MFDATAINDIA_DSN=tlws-mf-data-admin-dsn-dev:latest \
            --set-env-vars=DEPLOYMENT_GIT_SHA=$RELEASE_CANDIDATE_SHA \
            --command=/app/.venv/bin/python \
            --args=/app/scripts/migrate.py \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --labels=product=mfdataindia,environment=dev,managed-by=github-actions \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --wait \
            --quiet

      - name: Deploy private read-only service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="${{ vars.GCP_TLWS_MF_DATA_RUNTIME_SERVICE_ACCOUNT }}" \
            --execution-environment=gen2 \
            --ingress=internal \
            --no-allow-unauthenticated \
            --add-cloudsql-instances="${{ vars.GCP_TLWS_MF_DATA_CLOUD_SQL_INSTANCE }}" \
            --set-secrets=MFDATAINDIA_DSN=tlws-mf-data-runtime-dsn-dev:latest \
            --set-env-vars=APP_ENV=dev,DEPLOYMENT_GIT_SHA=$RELEASE_CANDIDATE_SHA,MFDATAINDIA_POOL_MIN_SIZE=1,MFDATAINDIA_POOL_MAX_SIZE=10 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=40 \
            --min=0 \
            --max=3 \
            --timeout=60 \
            --labels=product=mfdataindia,environment=dev,managed-by=github-actions \
            --quiet

      - name: Deploy private association writer disabled
        if: env.ASSOCIATION_WRITER_PROVISIONED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$ASSOCIATION_SERVICE_NAME" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="$ASSOCIATION_RUNTIME_SERVICE_ACCOUNT" \
            --execution-environment=gen2 \
            --ingress=internal \
            --no-allow-unauthenticated \
            --add-cloudsql-instances="${{ vars.GCP_TLWS_MF_DATA_CLOUD_SQL_INSTANCE }}" \
            --set-secrets=MFDATAINDIA_DSN=tlws-mf-data-association-writer-dsn-dev:latest \
            --set-env-vars=APP_ENV=dev,DEPLOYMENT_GIT_SHA=$RELEASE_CANDIDATE_SHA,MFDATAINDIA_ASSOCIATION_WRITES_ENABLED=false \
            --command=/app/.venv/bin/uvicorn \
            --args=mfdataindia.api.association_app:create_association_app,--factory,--host,0.0.0.0,--port,8080,--no-access-log \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=20 \
            --min=0 \
            --max=2 \
            --timeout=60 \
            --labels=product=mfdataindia,component=association-writer,environment=dev,managed-by=github-actions \
            --quiet
          # Activation promotes a named revision, so deployment must explicitly
          # restore the default contract: the latest, disabled revision serves.
          gcloud run services update-traffic "$ASSOCIATION_SERVICE_NAME" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --to-latest \
            --quiet

      - name: Reconcile private association-writer invoker policy
        if: env.ASSOCIATION_WRITER_PROVISIONED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          policy="$(gcloud run services get-iam-policy "$ASSOCIATION_SERVICE_NAME" \
            --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          while IFS= read -r member; do
            test -z "$member" && continue
            if [[ "$member" != "serviceAccount:$INSIGHTS_RUNTIME_SERVICE_ACCOUNT" ]]; then
              gcloud run services remove-iam-policy-binding "$ASSOCIATION_SERVICE_NAME" \
                --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" \
                --member="$member" --role=roles/run.invoker --condition=None --quiet >/dev/null
            fi
          done < <(jq -r '.bindings[]? | select(.role == "roles/run.invoker") | .members[]?' <<<"$policy")
          gcloud run services add-iam-policy-binding "$ASSOCIATION_SERVICE_NAME" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --member="serviceAccount:$INSIGHTS_RUNTIME_SERVICE_ACCOUNT" \
            --role=roles/run.invoker \
            --condition=None \
            --quiet >/dev/null

      - name: Reconcile private invoker policy
        shell: bash
        run: bash scripts/private_read_invokers_dev.sh reconcile

      - name: Reconcile the six-hour refresh job to the immutable image
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$REFRESH_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="${{ vars.GCP_TLWS_MF_DATA_INGEST_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ vars.GCP_TLWS_MF_DATA_CLOUD_SQL_INSTANCE }}" \
            --set-secrets=MFDATAINDIA_DSN=tlws-mf-data-ingest-dsn-dev:latest \
            --set-env-vars=MFDATAINDIA_SNAPSHOT_SCOPE=FULL \
            --command=/app/.venv/bin/python \
            --args=/app/scripts/refresh_daily.py \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --cpu=1 \
            --memory=1Gi \
            --labels=product=mfdataindia,environment=dev,operation=nav-refresh,managed-by=github-actions \
            --quiet

      - name: Deploy and execute the internal zero-retry smoke job
        shell: bash
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "$SERVICE_NAME" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format='value(status.url)')"
          test -n "$service_url"
          gcloud run jobs deploy "$PRIVATE_SMOKE_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="${{ vars.GCP_TLWS_MF_DATA_RUNTIME_SERVICE_ACCOUNT }}" \
            --network="$VPC_NETWORK" \
            --subnet="$VPC_SUBNET" \
            --vpc-egress=all-traffic \
            --set-env-vars="MFDATAINDIA_PRIVATE_BASE_URL=$service_url,MFDATAINDIA_PRIVATE_AUDIENCE=$service_url" \
            --command=/app/.venv/bin/python \
            --args=/app/scripts/smoke_private_api.py \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=2m \
            --labels=product=mfdataindia,component=private-smoke,environment=dev,managed-by=github-actions \
            --quiet
          gcloud run jobs execute "$PRIVATE_SMOKE_JOB" \
            --project="$EXPECTED_PROJECT" \
            --region="$EXPECTED_REGION" \
            --wait \
            --quiet

      - name: Reconcile private service and immutable revision
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE_NAME" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          service_url="$(jq -er '.status.url' <<<"$service_json")"
          test -n "$service_url"
          jq -e '.metadata.annotations["run.googleapis.com/ingress"] == "internal"' <<<"$service_json" >/dev/null
          jq -e '.status.conditions[] | select(.type == "Ready") | .status == "True"' <<<"$service_json" >/dev/null
          jq -e '.status.traffic | length == 1 and .[0].percent == 100' <<<"$service_json" >/dev/null
          bash scripts/private_read_invokers_dev.sh required
          external_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$service_url/api/health" || true)"
          case "$external_status" in
            2*) echo "MFDataIndia unexpectedly reachable from the public runner: HTTP $external_status" >&2; exit 1 ;;
          esac
          deployed_image="$(jq -er '.spec.template.spec.containers[0].image' <<<"$service_json")"
          case "$deployed_image" in
            *"@${{ steps.image.outputs.digest }}") ;;
            *) echo "Unexpected deployed image: $deployed_image" >&2; exit 1 ;;
          esac
          deployed_sha="$(jq -er '.spec.template.spec.containers[0].env[] | select(.name == "DEPLOYMENT_GIT_SHA") | .value' <<<"$service_json")"
          test "$deployed_sha" = "$RELEASE_CANDIDATE_SHA"

          refresh_json="$(gcloud run jobs describe "$REFRESH_JOB" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          refresh_image="$(jq -er '.spec.template.spec.template.spec.containers[0].image' <<<"$refresh_json")"
          case "$refresh_image" in
            *"@${{ steps.image.outputs.digest }}") ;;
            *) echo "Unexpected refresh image: $refresh_image" >&2; exit 1 ;;
          esac
          refresh_identity="$(jq -er '.spec.template.spec.template.spec.serviceAccountName' <<<"$refresh_json")"
          test "$refresh_identity" = "${{ vars.GCP_TLWS_MF_DATA_INGEST_SERVICE_ACCOUNT }}"
          refresh_scope="$(jq -er '.spec.template.spec.template.spec.containers[0].env[] | select(.name == "MFDATAINDIA_SNAPSHOT_SCOPE") | .value' <<<"$refresh_json")"
          test "$refresh_scope" = "FULL"
          jq -e '.spec.template.spec.template.spec.maxRetries == 0' <<<"$refresh_json" >/dev/null
          jq -e '.spec.template.spec.template.spec.containers[0].command == ["/app/.venv/bin/python"]' <<<"$refresh_json" >/dev/null
          jq -e '.spec.template.spec.template.spec.containers[0].args == ["/app/scripts/refresh_daily.py"]' <<<"$refresh_json" >/dev/null
          echo "MFDataIndia private DEV read service and refresh job reconciled"

      - name: Reconcile the optional association writer revision
        if: env.ASSOCIATION_WRITER_PROVISIONED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          writer_json="$(gcloud run services describe "$ASSOCIATION_SERVICE_NAME" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          jq -e '.metadata.annotations["run.googleapis.com/ingress"] == "internal"' <<<"$writer_json" >/dev/null
          jq -e '.status.conditions[] | select(.type == "Ready") | .status == "True"' <<<"$writer_json" >/dev/null
          writer_image="$(jq -er '.spec.template.spec.containers[0].image' <<<"$writer_json")"
          case "$writer_image" in
            *"@${{ steps.image.outputs.digest }}") ;;
            *) echo "Unexpected association writer image: $writer_image" >&2; exit 1 ;;
          esac
          writer_enabled="$(jq -er '.spec.template.spec.containers[0].env[] | select(.name == "MFDATAINDIA_ASSOCIATION_WRITES_ENABLED") | .value' <<<"$writer_json")"
          test "$writer_enabled" = "false"
          writer_policy="$(gcloud run services get-iam-policy "$ASSOCIATION_SERVICE_NAME" --project="$EXPECTED_PROJECT" --region="$EXPECTED_REGION" --format=json)"
          jq -e --arg insights "serviceAccount:$INSIGHTS_RUNTIME_SERVICE_ACCOUNT" \
            '([.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | sort) == ([$insights] | sort)' \
            <<<"$writer_policy" >/dev/null
          echo "MFDataIndia optional association writer reconciled disabled"
