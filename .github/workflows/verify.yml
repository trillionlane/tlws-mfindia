name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlws-mf-data-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PostgreSQL tests, contracts, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: mfdataindia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55521:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mfdataindia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MF_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:55521/mfdataindia_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.3
          uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Verify versioned OpenAPI contracts
        run: |
          uv run python scripts/export_openapi.py --check
          uv run python scripts/export_association_openapi.py --check
          uv run python scripts/export_review_openapi.py --check
          uv run python scripts/export_publication_openapi.py --check
          uv run python scripts/export_calendar_openapi.py --check
          uv run python scripts/export_rolling_openapi.py --check
          uv run python scripts/export_forward_calculator_openapi.py --check
          uv run python scripts/export_historical_calculator_openapi.py --check
          uv run python scripts/export_enrichment_openapi.py --check
          uv run python scripts/export_official_facts_openapi.py --check
          uv run python scripts/export_portfolio_openapi.py --check
          uv run python scripts/export_overlap_openapi.py --check
          uv run python scripts/export_distribution_openapi.py --check
          uv run python scripts/export_idcw_catalog_openapi.py --check
          uv run python scripts/export_current_facts_openapi.py --check
          uv run python scripts/export_monthly_facts_openapi.py --check
          uv run python scripts/export_fact_refresh_openapi.py --check
          uv run python scripts/export_fact_verification_openapi.py --check
          uv run python scripts/export_amc_coverage_openapi.py --check
          uv run python scripts/export_multi_amc_openapi.py --check
          uv run python scripts/export_amc_book_openapi.py --check

      - name: Verify UTI method-upgrade PostgreSQL boundaries first
        run: uv run python scripts/run_ci_tests.py focused --evidence "$RUNNER_TEMP/mfdata-tests-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Complete full test collection against PostgreSQL 18
        run: uv run python scripts/run_ci_tests.py remainder --evidence "$RUNNER_TEMP/mfdata-tests-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Verify read-only facts process tools
        run: |
          uv run python scripts/certify_official_facts_core_dev.py --help
          uv run python scripts/inventory_official_facts_dev.py --help
          uv run python scripts/reconcile_restored_official_facts.py --help
          uv run python scripts/inventory_amc_coverage_dev.py --help
          uv run python scripts/certify_amc_coverage_dev.py --help
          uv run python scripts/operate_registered_facts_dev.py --help
          uv run python scripts/refresh_registered_facts_dev.py --help
          uv run python scripts/certify_registered_facts_dev.py --help
          uv run python scripts/refresh_amc_books_dev.py --help
          uv run python scripts/operate_amc_books_dev.py --help
          uv run python scripts/certify_amc_books_dev.py --help
          uv run python scripts/inventory_fact_source_operations_dev.py --help
          uv run python scripts/probe_fact_source_catalogues_dev.py --help

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Scan tracked files for credential material
        run: ./scripts/scan_tracked_secrets.sh

  verify:
    name: Test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.3
          uv sync --frozen --all-extras

      - name: Build production image
        run: docker build --build-arg VCS_REF=${{ github.sha }} --tag tlws-mf-data:${{ github.sha }} .

      - name: Verify production image contents and user
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia; from mfdataindia.api.association_app import create_association_app; root = Path(mfdataindia.__file__).parent; assert (root / "web/index.html").is_file(); assert callable(create_association_app); assert Path("/app/scripts/backfill_nav.py").is_file(); assert Path("/app/scripts/smoke_private_api.py").is_file(); assert Path("/app/scripts/verify_optional_association_writer_dev.sh").is_file(); assert Path("/app/scripts/audit_nav_integrity.py").is_file(); assert Path("/app/scripts/reconcile_nav_audit_privileges.py").is_file(); assert Path("/app/scripts/verify_nav_audit_privileges.py").is_file(); assert Path("/app/sql/018_fund_family_association_tags.sql").is_file(); assert Path("/app/sql/019_reconcile_association_writer_privileges.sql").is_file(); assert Path("/app/sql/020_nav_quality_audit_privileges.sql").is_file()'

      - name: Verify dormant preservation-first rollout tools in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia.review.rollout; import mfdataindia.review.rollout_database; import mfdataindia.review.certification; assert Path("/app/contracts/mfdataindia-verified-review-v1.json").is_file(); assert Path("/app/scripts/certify_verified_review_dev.py").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/rollout_verified_review_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/inventory_fact_source_operations_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/probe_fact_source_catalogues_dev.py --help
          docker run --rm --entrypoint python "$image" -c 'from mfdataindia.enrichment.source_operations import policy; p = policy(); assert p["version"] == 1 and p["automatic_resolution_permitted"] is False'

      - name: Verify dormant DATA-02 operator tools in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia.audit.remediation; import mfdataindia.audit.remediation_evidence; import mfdataindia.audit.remediation_rehearsal; assert Path("/app/sql/021_nav_remediation_review.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/review_nav_remediation.py --help

      - name: Verify dormant complete portfolio profile and workers
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import xlrd; from mfdataindia.review.app import create_portfolios_app; assert len(create_portfolios_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 22; assert Path("/app/sql/optional/029_official_complete_portfolios.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/deploy_complete_portfolios_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_complete_portfolios_dev.py --help

      - name: Verify dormant weighted overlap profile and workers
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_overlap_app; assert len(create_overlap_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 26; assert Path("/app/sql/optional/030_reported_weighted_overlap.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/deploy_weighted_overlap_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_weighted_overlap_dev.py --help

      - name: Verify private read access guard in the image
        run: |
          docker run --rm --entrypoint python "tlws-mf-data:${{ github.sha }}" -c \
            'from pathlib import Path; assert Path("/app/scripts/private_read_invokers_dev.sh").is_file()'

      - name: Verify offline IDCW discovery tools, not a publication profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from mfdataindia.enrichment.idcw_discovery import policy; import mfdataindia.enrichment._idcw_discovery_worker; assert policy()["publication"] == "discovery_only_not_accepted_events"'
          docker run --rm --entrypoint python "$image" /app/scripts/discover_idcw_evidence.py --help

      - name: Verify internal IDCW research engine, not publication
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from mfdataindia.analytics.idcw_research import policy, validate_policy, engine_identity, ResearchInput; p = policy(); assert validate_policy(p); assert p["id"] == "idcw-gross-research-total-return"; assert p["version"] == 1; assert engine_identity()["code_hash"]; assert "coverage_complete" not in ResearchInput.model_fields'

      - name: Verify dormant private reported-observation profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_distribution_observations_app; assert len(create_distribution_observations_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 29; assert Path("/app/sql/optional/031_reported_distribution_observations.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/deploy_distribution_observations_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_distribution_observations_dev.py --help
      - name: Verify dormant multi-fund IDCW catalog profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_idcw_catalog_app; assert len(create_idcw_catalog_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 33; assert Path("/app/sql/optional/032_multi_fund_idcw_observations.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/deploy_idcw_catalog_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_idcw_catalog_dev.py --help

      - name: Verify current official facts profile and workers
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_current_facts_app; import mfdataindia.enrichment.current_facts_store; assert len(create_current_facts_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 35; assert Path("/app/sql/optional/033_current_official_facts.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/operate_current_facts_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_current_facts_dev.py --help

      - name: Verify bounded monthly facts profile and workers
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_monthly_facts_app; import mfdataindia.enrichment.monthly_store; assert len(create_monthly_facts_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 37; assert Path("/app/sql/optional/034_official_monthly_facts.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/operate_monthly_facts_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_monthly_facts_dev.py --help

      - name: Verify bounded official monthly refresh profile and workers
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_fact_refresh_app; import mfdataindia.enrichment.refresh_runtime; assert len(create_fact_refresh_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 39; assert Path("/app/config/official-facts-dev.json").is_file(); assert Path("/app/sql/optional/035_official_fact_refresh.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/refresh_official_facts_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/operate_fact_refresh_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_fact_refresh_dev.py --help

      - name: Verify private official-facts history and human-verification backend
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_fact_verification_app; import mfdataindia.enrichment.fact_review_store; assert len(create_fact_verification_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 43; assert Path("/app/sql/optional/036_official_fact_verification.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/operate_fact_verification_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_fact_verification_dev.py --help

      - name: Verify dormant all-AMC coverage profile and source register
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from mfdataindia.review.app import create_amc_coverage_app; from mfdataindia.enrichment.amc_register import load_register; assert len(create_amc_coverage_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 46; register = load_register(); assert len(register.members) == 57; assert all(not member.acquisition_enabled for member in register.members)'
          docker run --rm --entrypoint python "$image" /app/scripts/inventory_amc_coverage_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_amc_coverage_dev.py --help

      - name: Verify dormant registered multi-AMC profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_multi_amc_app; from mfdataindia.enrichment.multi_facts import registry; assert len(create_multi_amc_app("postgresql://fixture:fixture@127.0.0.1:1/fixture").openapi()["paths"]) == 49; assert len(registry()["sources"]) == 2; assert Path("/app/sql/optional/037_registered_monthly_facts.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/refresh_registered_facts_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/operate_registered_facts_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_registered_facts_dev.py --help

      - name: Build and verify PostgreSQL 18 restore image
        run: |
          set -euo pipefail
          image="tlws-mf-data-restore:${{ github.sha }}"
          docker build --file Dockerfile.restore --tag "$image" .
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint pg_restore "$image" --version | grep -F 'pg_restore (PostgreSQL) 18.'

      - name: Verify dormant DATA-03/04 operator tools in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia.audit.nav_corrections; import mfdataindia.jobs.nav_calculations; assert Path("/app/sql/022_nav_correction_consistency.sql").is_file(); assert Path("/app/scripts/sql/reconcile_nav_correction_privileges.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/correct_nav_data.py --help

      - name: Verify dormant verified-review feature in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_review_app; from mfdataindia.review.policy import policy, validate_policy; assert len(create_review_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 6; validate_policy(policy()); assert Path("/app/sql/optional/023_verified_fund_review.sql").is_file(); assert Path("/app/scripts/sql/reconcile_verified_review_privileges.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/verified_fund_review.py --help
      - name: Verify dormant additive research-publication profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_research_app; from mfdataindia.review.publication import policy; import mfdataindia.review.publication_operations; import mfdataindia.review.publication_certification; assert len(create_research_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 7; assert policy()["version"] == 1; assert Path("/app/sql/optional/024_research_publication.sql").is_file(); assert Path("/app/scripts/operate_research_publication_dev.py").is_file(); assert Path("/app/scripts/certify_research_publication_dev.py").is_file(); assert Path("/app/contracts/mfdataindia-research-publication-v1.json").is_file()'
      - name: Verify dormant additive calendar-analytics profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_calendar_app; from mfdataindia.analytics.calendar import policy,validate_policy; import mfdataindia.analytics.operations; import mfdataindia.analytics.certification; assert len(create_calendar_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 8; validate_policy(policy()); assert Path("/app/sql/optional/025_calendar_analytics.sql").is_file(); assert Path("/app/scripts/operate_calendar_analytics_dev.py").is_file(); assert Path("/app/scripts/certify_calendar_analytics_dev.py").is_file(); assert Path("/app/contracts/mfdataindia-calendar-analytics-v1.json").is_file()'
      - name: Verify dormant additive rolling-analytics profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_rolling_app; from mfdataindia.analytics.rolling import policy,validate_policy; import mfdataindia.analytics.rolling_operations; import mfdataindia.analytics.rolling_certification; assert len(create_rolling_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 9; validate_policy(policy()); assert Path("/app/sql/optional/026_rolling_analytics.sql").is_file(); assert Path("/app/scripts/operate_rolling_analytics_dev.py").is_file(); assert Path("/app/scripts/certify_rolling_analytics_dev.py").is_file(); assert Path("/app/contracts/mfdataindia-rolling-analytics-v1.json").is_file()'
      - name: Verify dormant additive forward-calculator profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_calculator_app; from mfdataindia.calculators.forward import policy,validate_policy; import mfdataindia.calculators.operations; import mfdataindia.calculators.certification; assert len(create_calculator_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 10; validate_policy(policy()); assert Path("/app/scripts/install_forward_calculator_policy_dev.py").is_file(); assert Path("/app/scripts/certify_forward_calculators_dev.py").is_file(); assert Path("/app/contracts/mfdataindia-forward-calculators-v1.json").is_file()'
      - name: Verify dormant additive historical-calculator profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_historical_calculator_app; from mfdataindia.calculators.historical import policy,validate_policy; import mfdataindia.calculators.historical_operations; import mfdataindia.calculators.historical_certification; assert len(create_historical_calculator_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 11; validate_policy(policy()); assert Path("/app/scripts/install_historical_calculator_policy_dev.py").is_file(); assert Path("/app/scripts/certify_historical_calculators_dev.py").is_file(); assert Path("/app/contracts/mfdataindia-historical-calculators-v1.json").is_file()'
      - name: Verify dormant official-enrichment evidence profile
        # Official-source evidence has its own explicit opt-in profile; image
        # presence does not activate a service or run the optional migration.
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_enrichment_app; import mfdataindia.enrichment.operations; import mfdataindia.enrichment.acquisition; assert len(create_enrichment_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 15; assert Path("/app/sql/optional/027_official_enrichment_evidence.sql").is_file(); assert Path("/app/contracts/mfdataindia-official-enrichment-v1.json").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/official_enrichment_evidence.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/capture_official_sources.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/deploy_official_evidence_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_official_evidence_dev.py --help
          docker run --rm --entrypoint python "$image" -c \
            'import io; from pypdf import PdfWriter; from mfdataindia.enrichment.pdf_evidence import extract_pdf; writer = PdfWriter(); writer.add_blank_page(width=200, height=200); output = io.BytesIO(); writer.write(output); result = extract_pdf(output.getvalue()); assert result["state"] == "no_text"; assert result["facts_accepted"] is False'

      - name: Verify dormant official-fund-facts profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_official_facts_app; import mfdataindia.enrichment.facts_operations; import mfdataindia.enrichment.facts_certification; assert len(create_official_facts_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 18; assert Path("/app/sql/optional/028_official_fund_facts.sql").is_file(); assert Path("/app/contracts/mfdataindia-official-facts-v1.json").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/deploy_official_facts_dev.py --help
          docker run --rm --entrypoint python "$image" /app/scripts/certify_official_facts_dev.py --help

      - name: Build and verify dormant PostgreSQL 18 review-backup tools
        run: |
          set -euo pipefail
          tools_image="tlws-mf-review-tools:${{ github.sha }}"
          docker build --build-arg VCS_REF="${{ github.sha }}" --file Dockerfile.review-tools --tag "$tools_image" .
          docker run --rm --entrypoint pg_dump "$tools_image" --version | grep -F 'PostgreSQL) 18.'
