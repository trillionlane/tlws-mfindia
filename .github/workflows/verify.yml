name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tlws-mf-data-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: mfdataindia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mfdataindia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MF_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/mfdataindia_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.3
          uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Verify versioned OpenAPI contracts
        run: |
          uv run python scripts/export_openapi.py --check
          uv run python scripts/export_association_openapi.py --check
          uv run python scripts/export_review_openapi.py --check
          uv run python scripts/export_publication_openapi.py --check

      - name: Test against PostgreSQL 18
        run: uv run pytest tests/ -q

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Scan tracked files for credential material
        run: ./scripts/scan_tracked_secrets.sh

      - name: Build production image
        run: docker build --build-arg VCS_REF=${{ github.sha }} --tag tlws-mf-data:${{ github.sha }} .

      - name: Verify production image contents and user
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia; from mfdataindia.api.association_app import create_association_app; root = Path(mfdataindia.__file__).parent; assert (root / "web/index.html").is_file(); assert callable(create_association_app); assert Path("/app/scripts/backfill_nav.py").is_file(); assert Path("/app/scripts/smoke_private_api.py").is_file(); assert Path("/app/scripts/verify_optional_association_writer_dev.sh").is_file(); assert Path("/app/scripts/audit_nav_integrity.py").is_file(); assert Path("/app/scripts/reconcile_nav_audit_privileges.py").is_file(); assert Path("/app/scripts/verify_nav_audit_privileges.py").is_file(); assert Path("/app/sql/018_fund_family_association_tags.sql").is_file(); assert Path("/app/sql/019_reconcile_association_writer_privileges.sql").is_file(); assert Path("/app/sql/020_nav_quality_audit_privileges.sql").is_file()'

      - name: Verify dormant preservation-first rollout tools in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia.review.rollout; import mfdataindia.review.rollout_database; import mfdataindia.review.certification; assert Path("/app/contracts/mfdataindia-verified-review-v1.json").is_file(); assert Path("/app/scripts/certify_verified_review_dev.py").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/rollout_verified_review_dev.py --help

      - name: Verify dormant DATA-02 operator tools in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia.audit.remediation; import mfdataindia.audit.remediation_evidence; import mfdataindia.audit.remediation_rehearsal; assert Path("/app/sql/021_nav_remediation_review.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/review_nav_remediation.py --help

      - name: Verify private read access guard in the image
        run: |
          docker run --rm --entrypoint python "tlws-mf-data:${{ github.sha }}" -c \
            'from pathlib import Path; assert Path("/app/scripts/private_read_invokers_dev.sh").is_file()'

      - name: Build and verify PostgreSQL 18 restore image
        run: |
          set -euo pipefail
          image="tlws-mf-data-restore:${{ github.sha }}"
          docker build --file Dockerfile.restore --tag "$image" .
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint pg_restore "$image" --version | grep -F 'pg_restore (PostgreSQL) 18.'

      - name: Verify dormant DATA-03/04 operator tools in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; import mfdataindia.audit.nav_corrections; import mfdataindia.jobs.nav_calculations; assert Path("/app/sql/022_nav_correction_consistency.sql").is_file(); assert Path("/app/scripts/sql/reconcile_nav_correction_privileges.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/correct_nav_data.py --help

      - name: Verify dormant verified-review feature in the image
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_review_app; from mfdataindia.review.policy import policy, validate_policy; assert len(create_review_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 6; validate_policy(policy()); assert Path("/app/sql/optional/023_verified_fund_review.sql").is_file(); assert Path("/app/scripts/sql/reconcile_verified_review_privileges.sql").is_file()'
          docker run --rm --entrypoint python "$image" /app/scripts/verified_fund_review.py --help
      - name: Verify dormant additive research-publication profile
        run: |
          set -euo pipefail
          image="tlws-mf-data:${{ github.sha }}"
          docker run --rm --entrypoint python "$image" -c \
            'from pathlib import Path; from mfdataindia.review.app import create_research_app; from mfdataindia.review.publication import policy; import mfdataindia.review.publication_operations; import mfdataindia.review.publication_certification; assert len(create_research_app("postgresql://contract:contract@127.0.0.1:1/contract").openapi()["paths"]) == 7; assert policy()["version"] == 1; assert Path("/app/sql/optional/024_research_publication.sql").is_file(); assert Path("/app/scripts/operate_research_publication_dev.py").is_file(); assert Path("/app/scripts/certify_research_publication_dev.py").is_file(); assert Path("/app/contracts/mfdataindia-research-publication-v1.json").is_file()'
      - name: Build and verify dormant PostgreSQL 18 review-backup tools
        run: |
          set -euo pipefail
          tools_image="tlws-mf-review-tools:${{ github.sha }}"
          docker build --build-arg VCS_REF="${{ github.sha }}" --file Dockerfile.review-tools --tag "$tools_image" .
          docker run --rm --entrypoint pg_dump "$tools_image" --version | grep -F 'PostgreSQL) 18.'
          docker run --rm --entrypoint python "$tools_image" -c 'from mfdataindia.review.regional_backup import NativePg18; from pathlib import Path; assert Path("/app/scripts/backup_verified_review_dev.py").is_file()'
